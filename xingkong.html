<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>荆馨瑶 · 生日快乐</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:#000; overflow:hidden; color:#fff; position:fixed; inset:0; touch-action:manipulation;
  }
  #stars{ position:absolute; inset:0; z-index:0; }
  .title{
    font-size:26px; font-weight:800; letter-spacing:3px; text-align:center;
    background:linear-gradient(90deg,#ffe08a,#ffb3c6,#b79cff,#ffe08a); background-size:300% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 4s linear infinite;
  }
  @keyframes shine{ to{ background-position:300% center; } }
  .subtitle{ font-size:13px; color:rgba(255,255,255,.6); letter-spacing:2px; text-align:center; }
  .btn{
    border:none; cursor:pointer; font-size:16px; font-weight:800; letter-spacing:2px; color:#fff;
    padding:14px 32px; border-radius:999px; background:linear-gradient(90deg,#ff7aa8,#a77bff);
    box-shadow:0 12px 30px rgba(180,110,255,.45); animation:pulse 2.2s ease infinite; transition:transform .15s;
  }
  .btn:active{ transform:scale(.94); }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  .go-btn{ animation:none; background:linear-gradient(90deg,#ffb03a,#ff6fa5); box-shadow:0 12px 30px rgba(255,150,90,.45); margin-top:14px; }

  .stage-heart{
    position:fixed; inset:0; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; transition:opacity .6s ease;
  }
  .stage-heart.hide{ opacity:0; pointer-events:none; }
  .tip{ font-size:12px; color:rgba(255,255,255,.45); letter-spacing:1px; }

  #fx{ position:fixed; inset:0; z-index:2; pointer-events:none; }
  .bubble{
    position:absolute; display:flex; align-items:center; justify-content:center;
    width:96px; height:42px; border-radius:14px; padding:4px 6px;
    font-size:12px; font-weight:700; color:#5b4a57; text-align:center; line-height:1.25;
    box-shadow:0 6px 16px rgba(0,0,0,.25); animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .bubble span{ display:block; animation:bob 4s ease-in-out infinite; }
  @keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
  .center-msg{
    position:fixed; left:50%; top:44%; transform:translate(-50%,-50%); z-index:4;
    font-size:30px; font-weight:800; letter-spacing:4px; white-space:nowrap;
    color:#ffe08a; text-shadow:0 0 26px rgba(255,180,120,.8); opacity:0; pointer-events:none;
  }
  .center-msg.show{ animation:msgIn 1.4s ease forwards; }
  @keyframes msgIn{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.6);} 60%{ opacity:1; transform:translate(-50%,-50%) scale(1.05);} 100%{ opacity:1; transform:translate(-50%,-50%) scale(1);} }

  .stage-cake{ position:fixed; inset:0; z-index:3; display:none; }
  .stage-cake.show{ display:block; }
  #cakeCanvas{ position:absolute; inset:0; width:100%; height:100%; }
  .cake-title{
    position:absolute; top:26px; left:0; right:0; z-index:4; text-align:center;
    font-size:22px; font-weight:800; letter-spacing:4px; color:#ffe3b0; text-shadow:0 0 20px rgba(255,180,110,.7);
  }
  .cake-title small{ display:block; margin-top:6px; font-size:12px; font-weight:400; letter-spacing:3px; color:rgba(255,255,255,.48); text-shadow:none; }
  .cake-hint{ position:absolute; left:0; right:0; bottom:22px; z-index:4; text-align:center; font-size:13px; letter-spacing:1px; color:rgba(255,255,255,.55); }
  .cake-hint.fire{ color:rgba(255,200,120,.9); text-shadow:0 0 12px rgba(255,150,60,.6); }
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="stage-heart" id="stageHeart">
    <div class="title">❤️ 生日快乐</div>
    <div class="subtitle">献给 · 荆馨瑶</div>
    <button class="btn" id="btnHeart">💖 点我 · 弹出爱心祝福</button>
    <button class="btn go-btn" id="btnGo" style="display:none">✨ 进入星河蛋糕 →</button>
    <div class="tip">点上面的按钮，爱心会把祝福一颗颗送到你面前</div>
  </div>

  <div class="stage-cake" id="stageCake">
    <canvas id="cakeCanvas"></canvas>
    <div class="cake-title">生日快乐<small>HAPPY BIRTHDAY · 荆馨瑶</small></div>
    <div class="cake-hint" id="cakeHint">👆 点一下蛋糕 · 放烟花 🎆</div>
  </div>

  <div id="fx"></div>
  <div class="center-msg" id="msg">生日快乐 ♡</div>

<script>
(function(){
  /* ---------- 音频 ---------- */
  let ac=null;
  function audio(){ try{ ac=ac||new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }catch(e){ return null; } }
  function tone(freq,dur,type,vol,start){
    if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,start); g.gain.exponentialRampToValueAtTime(vol,start+.02); g.gain.exponentialRampToValueAtTime(.0001,start+dur);
    o.connect(g); g.connect(ac.destination); o.start(start); o.stop(start+dur+.05);
  }
  function sfx(kind){
    if(!audio()) return; const t0=ac.currentTime+.02;
    if(kind==='launch'){ [293.66,392.00,523.25].forEach((f,i)=>tone(f,.11,'sine',.11,t0+i*.06)); }
    else if(kind==='boom'){ tone(180,.42,'sine',.22,t0); tone(110,.5,'sine',.18,t0+.02); }
  }
  const NOTES={'G4':392.00,'A4':440.00,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99};
  const MELODY=[
    ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
    ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
    ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
    ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]
  ];
  const BEAT=.4, MELODY_SECONDS=25*BEAT;
  function playMelodyOnce(){
    if(!audio()) return;
    let t=ac.currentTime+.06;
    MELODY.forEach(([n,d])=>{
      const dur=d*BEAT, f=NOTES[n];
      tone(f,dur,'triangle',.3,t); tone(f/2,dur,'sine',.11,t); tone(f*1.5,dur*.9,'sine',.05,t); t+=dur;
    });
    [523.25,659.25,783.99].forEach(f=>tone(f,2.2,'sine',.06,t-.2));
  }
  let bgOn=false, bgTimer=null;
  function startMusic(){
    if(bgOn) return; bgOn=true; audio();
    const loop=()=>{ if(!bgOn) return; playMelodyOnce(); bgTimer=setTimeout(loop,(MELODY_SECONDS+1.4)*1000); };
    loop();
  }

  /* ---------- 第一屏背景星 ---------- */
  const sc=document.getElementById('stars'), scx=sc.getContext('2d');
  let SW,SH; function resizeS(){ SW=sc.width=innerWidth; SH=sc.height=innerHeight; }
  addEventListener('resize',resizeS); resizeS();
  const SC1=['#ffc832','#ff5050','#50b4ff','#dc50ff','#50ff96','#ffffff'];
  const bgStars=[];
  for(let i=0;i<120;i++) bgStars.push({x:Math.random()*SW,y:Math.random()*SH,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,r:Math.random()*2.4+.6,c:SC1[i%SC1.length],tw:Math.random()*Math.PI*2});
  function bgLoop(){
    scx.clearRect(0,0,SW,SH);
    for(const s of bgStars){
      s.x+=s.vx; s.y+=s.vy; s.tw+=.05;
      if(s.x<-5)s.x=SW+5; if(s.x>SW+5)s.x=-5; if(s.y<-5)s.y=SH+5; if(s.y>SH+5)s.y=-5;
      scx.globalAlpha=.5+.5*Math.sin(s.tw); scx.fillStyle=s.c;
      scx.beginPath(); scx.arc(s.x,s.y,s.r,0,Math.PI*2); scx.fill();
    }
    scx.globalAlpha=1; requestAnimationFrame(bgLoop);
  }
  bgLoop();

  /* ---------- 爱心祝福 ---------- */
  const BLESS=['生日快乐 🎂','天天开心','万事顺意','平安喜乐','心想事成','所愿皆成真','新的一岁继续发光','继续相信自己','每天都开心','好运一直陪你','未来越来越好','美好如期而至','闪闪发光','被世界温柔以待','今天也要开心呀','所愿皆能实现','自由快乐闪耀','一直被爱包围'];
  const PASTEL=['#ffe3ee','#fff0f5','#e3f2ff','#fff6d6','#dff7ec','#ddf6f3','#efe3ff','#ffe0f7','#fff3e0','#fde8e8'];
  const fx=document.getElementById('fx'), msg=document.getElementById('msg'), btnHeart=document.getElementById('btnHeart');
  let heartDone=false;
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function spawnHeart(){
    if(heartDone) return; heartDone=true;
    startMusic();
    btnHeart.style.display='none';
    const N=52,bw=96,bh=42,pts=[];
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    for(let i=0;i<N;i++){
      const t=2*Math.PI*i/N, x=16*Math.sin(t)**3, y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      pts.push({x,y}); mnx=Math.min(mnx,x); mxx=Math.max(mxx,x); mny=Math.min(mny,y); mxy=Math.max(mxy,y);
    }
    const cw=innerWidth,ch=innerHeight, scale=Math.min((cw*.92-bw)/(mxx-mnx),(ch*.6-bh)/(mxy-mny));
    const ccx=cw/2, ccy=ch*.44, mx=(mnx+mxx)/2, my=(mny+mxy)/2;
    pts.forEach((p,i)=>{
      const left=ccx+(p.x-mx)*scale-bw/2, top=ccy-(p.y-my)*scale-bh/2;
      setTimeout(()=>{
        const b=document.createElement('div'); b.className='bubble';
        b.style.left=clamp(left,4,cw-bw-4)+'px'; b.style.top=clamp(top,4,ch-bh-4)+'px';
        b.style.background=PASTEL[i%PASTEL.length];
        const s=document.createElement('span'); s.textContent=BLESS[i%BLESS.length];
        b.appendChild(s); fx.appendChild(b);
      },i*60);
    });
    setTimeout(()=>msg.classList.add('show'), N*60+250);
    setTimeout(()=>document.getElementById('btnGo').style.display='inline-block', N*60+400);
  }
  btnHeart.addEventListener('click', spawnHeart);
  document.getElementById('stageHeart').addEventListener('pointerdown', e=>{ if(e.target.closest('button')) return; spawnHeart(); });

  /* ============================================================
     第二屏：3D 旋转发光粒子蛋糕 + 烟花
     ============================================================ */
  const cc=document.getElementById('cakeCanvas'), cxx=cc.getContext('2d');
  const cakeHint=document.getElementById('cakeHint'), stageCake=document.getElementById('stageCake');
  let CW=0, CH=0, cakeVisible=false, mode='cake', t=0, yaw=0.3;

  /* 发光粒子精灵 */
  const SPR={};
  function sprite(color){
    if(SPR[color]) return SPR[color];
    const s=document.createElement('canvas'); s.width=s.height=32;
    const g=s.getContext('2d'), rg=g.createRadialGradient(16,16,0,16,16,16);
    rg.addColorStop(0, color); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,32,32);
    SPR[color]=s; return s;
  }

  /* 微粒集 */
  let P=[], embers=[];
  const CAKE_PAL=['#5b2fb8','#8a5be0','#d76bb0','#ff6aa8','#ff9bb0','#ffbb88','#ffd66e','#fff0cc'];
  const SPRINKLE=['#ff5050','#50b4ff','#50ff96','#ffd32e','#ffffff'];
  const FLAME=['#fff8e0','#ffd066','#ff8a38'];
  const RING='#ffd66e', CANDLE='#ffd9a0';

  function cakeColor(y, ytop){
    const k=clamp(y/ytop,0,1);
    return CAKE_PAL[Math.round(k*(CAKE_PAL.length-1))];
  }
  function pushP(x,y,z,col,base,a,fl){
    P.push({x,y,z,col,base,a,tws:.5+Math.random()*2.2,twp:Math.random()*Math.PI*2,fl:!!fl});
  }
  function side(R,yBot,yTop,n,colFn,base,a){
    for(let i=0;i<n;i++){
      const ang=Math.random()*Math.PI*2, y=yBot+Math.random()*(yTop-yBot);
      pushP(R*Math.cos(ang), y, R*Math.sin(ang), colFn?colFn(y):CANDLE, base, a, false);
    }
  }
  function topDisc(R,y,n,colFn,base,a){
    for(let i=0;i<n;i++){
      const rr=R*Math.sqrt(Math.random()), ang=Math.random()*Math.PI*2;
      pushP(rr*Math.cos(ang), y, rr*Math.sin(ang), colFn?colFn(y):CAKE_PAL[7], base, a, false);
    }
  }
  function buildParticles(){
    P=[];
    const R1=Math.min(CW,CH)*0.27, R2=R1*0.78, R3=R1*0.56;
    const h1=R1*0.78, h2=R2*0.78, h3=R3*0.88;
    const ytop=h1+h2+h3, yShift=ytop*0.5;
    const cR=R1*0.055, cH=R1*0.5, cBase=ytop, cTop=ytop+cH;
    const fY=cTop+R1*0.24;

    // 底盘 + 三层 + 蜡烛（颜色按高度渐变）
    topDisc(R1*1.12, 0, 340, ()=>'#5b2fb8', 4.2, .55);
    side(R1, 0, h1, 780, y=>cakeColor(y,ytop), 5.2, .78);
    side(R2, h1, h1+h2, 560, y=>cakeColor(y,ytop), 5.0, .78);
    side(R3, h1+h2, ytop, 430, y=>cakeColor(y,ytop), 5.0, .80);
    topDisc(R2, h1, 190, y=>cakeColor(y,ytop), 4.8, .5);
    topDisc(R3, ytop, 320, y=>cakeColor(y,ytop), 5.0, .88);
    // 彩色糖针
    for(let i=0;i<260;i++){
      const tier=Math.random()<.5?1:2;
      const R= tier===1?R2:R3;
      const yb= tier===1?h1:h1+h2, yt= tier===1?h1+h2:ytop;
      const ang=Math.random()*Math.PI*2, y=yb+Math.random()*(yt-yb);
      pushP((R-1)*Math.cos(ang), y, (R-1)*Math.sin(ang), SPRINKLE[i%SPRINKLE.length], 7+Math.random()*4, .95, false);
    }
    // 蜡烛
    side(cR, cBase, cTop, 120, ()=>CANDLE, 4.5, .85);
    topDisc(cR, cTop, 40, ()=>CANDLE, 4.5, .85);
    // 火焰
    const fR=R1*0.055;
    for(let i=0;i<240;i++){
      const ang=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random());
      const yy=fY + Math.sin(ang)*rr*fR*2.4 - fR*.5;
      const xx=Math.cos(ang)*rr*fR;
      const col = rr<.4?FLAME[0]:(rr<.72?FLAME[1]:FLAME[2]);
      pushP(xx, yy, Math.sin(ang)*rr*fR, col, 7+Math.random()*5, .95, true);
    }
    // 卫星光环
    for(let i=0;i<90;i++){
      const ang=Math.random()*Math.PI*2, rr=R1*1.16;
      pushP(Math.cos(ang)*rr, ytop*.5, Math.sin(ang)*rr, RING, 3+Math.random()*2, .32, false);
    }
    // 位移到原点居中
    for(const p of P){ p.y -= yShift; }
  }

  /* 烟花 */
  const FW_COLORS=['#ff5d8f','#ffd166','#8fd6c4','#b388eb','#6a9bff','#ff9ec2','#a8e6cf','#ffb03a'];
  const rockets=[], sparks=[], flashes=[];
  let fwTimer=null;
  function launch(){
    const x=CW*.15+Math.random()*CW*.7;
    rockets.push({x, y:CH+8, vx:(Math.random()-.5)*1.6, vy:-(9+Math.random()*5.5), c:FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)]});
    sfx('launch');
  }
  function explode(r){
    for(let i=0;i<90;i++){
      const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*4.8;
      sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:(Math.random()<.18?'#ffffff':r.c),life:55+Math.random()*40,r:1.4+Math.random()*1.9});
    }
    flashes.push({x:r.x,y:r.y,life:10,max:10}); sfx('boom');
  }

  /* 渲染：蛋糕模式 */
  const TILT=0.42, PERSP=820, ZOFF=340;
  function drawCake3D(){
    const stv=Math.sin(TILT), ctv=Math.cos(TILT);
    const syA=Math.sin(yaw), cyA=Math.cos(yaw);
    const cx0=CW/2, cy0=CH/2;
    for(const p of P){
      const x1=p.x*cyA - p.z*syA;
      const z1=p.x*syA + p.z*cyA;
      const y2=p.y*ctv + z1*stv;
      const z2=-p.y*stv + z1*ctv;
      const sc=PERSP/(PERSP+z2+ZOFF);
      const sx=cx0 + x1*sc, sy=cy0 - y2*sc;
      if(sx<-50||sx>CW+50||sy<-50||sy>CH+50) continue;
      const tw=.62+.38*Math.sin(t*p.tws+p.twp);
      let al=p.a*tw*(.5+.5*sc);
      if(p.fl) al=p.a*(.55+.45*Math.sin(t*9+p.twp))*(.55+.45*sc);
      cxx.globalAlpha=al;
      const size=p.base*sc;
      cxx.drawImage(sprite(p.col), sx-size/2, sy-size/2, size, size);
    }
  }
  function drawEmbers(){
    for(let i=embers.length-1;i>=0;i--){
      const e=embers[i];
      e.x+=e.vx; e.y+=e.vy; e.life-=.012;
      if(e.life<=0){ embers.splice(i,1); continue; }
      cxx.globalAlpha=e.life*.8;
      const s=e.r*2;
      cxx.drawImage(sprite(e.c), e.x-s/2, e.y-s/2, s, s);
    }
  }
  function spawnEmber(x,y){
    if(embers.length>130) return;
    embers.push({x,y,vx:(Math.random()-.5)*.7, vy:-(.35+Math.random()*.9), life:1, r:1.5+Math.random()*2.5, c:Math.random()<.5?'#ffd066':'#fff8e0'});
  }

  function drawNebula(){
    const g=cxx.createRadialGradient(CW*.5,CH*.44,0, CW*.5,CH*.44, CW*.55);
    g.addColorStop(0,'rgba(110,64,196,.15)'); g.addColorStop(.55,'rgba(255,106,168,.06)'); g.addColorStop(1,'rgba(0,0,0,0)');
    cxx.fillStyle=g; cxx.fillRect(0,0,CW,CH);
  }
  function drawFireworks(){
    cxx.fillStyle='#000'; cxx.fillRect(0,0,CW,CH);
    for(let i=rockets.length-1;i>=0;i--){
      const r=rockets[i]; r.x+=r.vx; r.y+=r.vy; r.vy+=.14;
      cxx.globalAlpha=.95; cxx.fillStyle=r.c;
      cxx.beginPath(); cxx.arc(r.x,r.y,2.6,0,Math.PI*2); cxx.fill();
      if(r.vy>=-1.5 || r.y<CH*.24){ explode(r); rockets.splice(i,1); }
    }
    for(let i=flashes.length-1;i>=0;i--){
      const f=flashes[i]; f.life--;
      if(f.life<=0){ flashes.splice(i,1); continue; }
      const a=f.life/f.max, rad=(1-a)*52+6;
      cxx.globalAlpha=a*.6; cxx.fillStyle='#fff';
      cxx.beginPath(); cxx.arc(f.x,f.y,rad,0,Math.PI*2); cxx.fill();
    }
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=.05; s.vx*=.985; s.vy*=.985; s.life--;
      if(s.life<=0){ sparks.splice(i,1); continue; }
      cxx.globalAlpha=Math.min(1,s.life/28); cxx.fillStyle=s.c;
      cxx.beginPath(); cxx.arc(s.x,s.y,s.r,0,Math.PI*2); cxx.fill();
    }
    cxx.globalAlpha=1;
  }

  function cakeLoop(){
    t+=.08;
    if(CW!==innerWidth || CH!==innerHeight){ CW=cc.width=innerWidth; CH=cc.height=innerHeight; buildParticles(); }
    if(CW>0 && cakeVisible){
      cxx.fillStyle='#000'; cxx.fillRect(0,0,CW,CH);
      if(mode==='cake'){
        drawNebula();
        cxx.save(); cxx.globalCompositeOperation='lighter';
        yaw+=.005;
        drawCake3D();
        // 火焰顶部升腾火星 + 底部氤氲尘埃
        if(Math.random()<.5) spawnEmber(CW/2 + (Math.random()-.5)*30, CH/2 - CH*.28);
        if(Math.random()<.3) spawnEmber(Math.random()*CW, CH*.72);
        drawEmbers();
        cxx.restore();
      }else drawFireworks();
    }
    requestAnimationFrame(cakeLoop);
  }
  cakeLoop();

  function setFireworks(on){
    if(on){
      mode='fireworks'; cakeHint.textContent='🎆 烟花绽放中 · 点一下返回蛋糕'; cakeHint.classList.add('fire');
      if(!fwTimer){ launch(); fwTimer=setInterval(()=>{ launch(); if(Math.random()<.6) launch(); }, 360); }
    }else{
      mode='cake'; cakeHint.textContent='👆 点一下蛋糕 · 放烟花 🎆'; cakeHint.classList.remove('fire');
      clearInterval(fwTimer); fwTimer=null; rockets.length=0; sparks.length=0; flashes.length=0;
    }
  }
  cc.addEventListener('click', ()=>{ setFireworks(mode!=='fireworks'); });

  /* ---------- 阶段切换 ---------- */
  const stageHeart=document.getElementById('stageHeart');
  document.getElementById('btnGo').addEventListener('click', ()=>{
    stageHeart.classList.add('hide');
    stageCake.classList.add('show');
    cakeVisible=true;
  });
})();
</script>
</body>
</html>
